<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC lens studio</title>
  <link rel="stylesheet" href="https://use.typekit.net/gxf5vfe.css">
  <link rel="stylesheet" href="/src/css/reset.css">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/remote.css">
</head>

<body>
  <div class="explanation" id="explanation">
    <h1 class="explanation__title">AntwerPOV</h1>
    <button id="connectButton" class="connect__button">Start connection</button>
  </div>

  <section class="screen__start hidden" id="screenStart">
    <div class="start__info">
      <h1 class="start__title">AntwerPOV</h1>
      <div class="start__action">
      <p class="start__button" id="startPovButton">Tap to improve your <span class="bacalar">POV</span></p>
      <img class="start__tap" src="./src/assets/remote/tap.png" alt="tap icon" width="125">
      </div>
    </div>
    <div class="start__background">
      <img class="background__bubble1" src="./src/assets/remote/purple-balloon.svg" alt="pixel balloon" width="130">
      <img class="background__bubble2" src="./src/assets/remote/whitr.png" alt="pixel balloon" width="143">
      <img class="background__bubble3" src="./src/assets/remote/green.png" alt="pixel balloon" width="105">
    </div>
  </section>

  <section class="home screen hidden" id="screenHome">
    <h2 class="home__title">Customize your POV</h2>
    <div id="goAccessoriesButton" class="home__button"></div>
      <p class="button__text">Add extra <span class="button__text--green">accessories</span></button>
      <img class="button__img" src="./src/assets/remote/acc-icon.png" alt="edit icon" width="104">
    </div>
    <div id="goBackgroundsButton" class="home__button"></div>
     <p class="button__text">Pick a <span class="button__text--green">background</span></button>
     <img class="button__img" src="./src/assets/remote/bg-icon.png" alt="edit icon" width="86">
    </div>
    <button id="goRouteButton">Get a route</button>
    <button id="goPictureButton">Capture this POV</button>
  </section>

  <section class="screen hidden" id="screenAccessories">
    <button class="backButton">←</button>
    <h2>Add extra accessories</h2>
    <div id="accessoryList"></div>
  </section>

  <section class="screen hidden" id="screenBackgrounds">
    <button class="backButton">←</button>
    <h2>Pick a background</h2>
    <div id="backgroundList"></div>
  </section>

  <section class="screen hidden" id="screenPicture">
    <button class="backButton">←</button>
    <h2>Capture this POV</h2>
    <button id="captureButton">Capture</button>
  </section>

  <section class="screen hidden" id="screenPictureTaken">
    <h2>Keep this POV?</h2>
  </section>

  <section class="screen hidden" id="screenRoute">
    <button class="backButton">←</button>
    <h2>Get a route</h2>
    <p id="routeLabel"></p>
  </section>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script type="module" src="/src/remote/remote-webrtc.ts"></script>
</body>

</html>
